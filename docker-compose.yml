services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resume_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_analyzer"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/resume_analyzer
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-0123456789}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

volumes:
  pgdata:
