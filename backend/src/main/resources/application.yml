spring:
  application:
    name: resume-match-analyzer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resume_analyzer}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  cache:
    type: caffeine
    cache-names: aiAnalysis
    caffeine:
      spec: maximumSize=500,expireAfterWrite=24h

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # Must be at least 32 characters. Always override JWT_SECRET outside local dev.
    secret: ${JWT_SECRET:local-dev-secret-change-me-local-dev-secret}
    expiration: ${JWT_EXPIRATION:PT2H}
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    max-tokens: 2000
    timeout: PT30S
    max-resume-chars: 15000
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:5}
    refill-period: ${RATE_LIMIT_REFILL_PERIOD:PT1M}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
